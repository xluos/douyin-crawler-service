name: Deploy Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-service
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_DIR: /opt/douyin-crawler-service
      SERVICE_PORT: 18099
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
      IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest
      GHCR_USERNAME: ${{ github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python -m compileall -q src

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$GHCR_TOKEN"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' SERVICE_PORT='$SERVICE_PORT' IMAGE_REF='$IMAGE_REF' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p "$DEPLOY_DIR/data"
          cd "$DEPLOY_DIR"

          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          cat > docker-compose.deploy.yml <<COMPOSE
          services:
            douyin-crawler-service:
              image: ${IMAGE_REF}
              container_name: douyin-crawler-service
              restart: unless-stopped
              environment:
                DOUYIN_SPIDER_PATH: /opt/DouYin_Spider
                SERVICE_DATA_DIR: /app/data
                SERVICE_HOST: 0.0.0.0
                SERVICE_PORT: ${SERVICE_PORT}
                BROWSER_CHANNEL: ""
                WORKER_POLL_SECONDS: 1
              ports:
                - "${SERVICE_PORT}:${SERVICE_PORT}"
              volumes:
                - ./data:/app/data
          COMPOSE

          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

          healthy=0
          for attempt in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:${SERVICE_PORT}/health" >/dev/null; then
              healthy=1
              break
            fi
            sleep 3
          done

          if [ "$healthy" != "1" ]; then
            docker compose -f docker-compose.deploy.yml logs --tail=160 douyin-crawler-service
            exit 1
          fi

          docker image prune -f --filter "until=168h" >/dev/null
          REMOTE
