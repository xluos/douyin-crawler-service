name: Deploy Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-service
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
      IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest
      DOUYIN_SPIDER_REF: d9766c9dd0f3bf801d3dd09facb1d24f2a1c5c53

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python -m compileall -q src

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_LATEST }}
          build-args: |
            DOUYIN_SPIDER_REF=${{ env.DOUYIN_SPIDER_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/douyin-crawler-service' }}
      SERVICE_PORT: ${{ vars.SERVICE_PORT || '18099' }}
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
      BARK_DEPLOY_NOTIFY_KEY: ${{ secrets.BARK_DEPLOY_NOTIFY_KEY }}
      DEPLOY_NOTIFY_TITLE: douyin-crawler-service部署通知

    steps:
      - name: Validate deployment config
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

      - name: Configure SSH
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' SERVICE_PORT='$SERVICE_PORT' IMAGE_REF='$IMAGE_REF' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          mkdir -p "$DEPLOY_DIR/data"
          cd "$DEPLOY_DIR"

          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null

          cat > docker-compose.deploy.yml <<COMPOSE
          services:
            douyin-crawler-service:
              image: ${IMAGE_REF}
              container_name: douyin-crawler-service
              restart: unless-stopped
              environment:
                DOUYIN_SPIDER_PATH: /opt/DouYin_Spider
                SERVICE_DATA_DIR: /app/data
                SERVICE_HOST: 0.0.0.0
                SERVICE_PORT: ${SERVICE_PORT}
                BROWSER_CHANNEL: ""
                WORKER_POLL_SECONDS: 1
              ports:
                - "${SERVICE_PORT}:${SERVICE_PORT}"
              volumes:
                - ./data:/app/data
          COMPOSE

          docker compose -f docker-compose.deploy.yml pull
          docker run --rm --user 0:0 -v "$DEPLOY_DIR/data:/target" "$IMAGE_REF" chown -R 1001:1001 /target
          docker compose -f docker-compose.deploy.yml up -d

          healthy=0
          for attempt in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:${SERVICE_PORT}/health" >/dev/null; then
              healthy=1
              break
            fi
            sleep 3
          done

          if [ "$healthy" != "1" ]; then
            docker compose -f docker-compose.deploy.yml logs --tail=160 douyin-crawler-service
            exit 1
          fi

          docker image prune -f --filter "until=168h" >/dev/null
          REMOTE

      - name: Notify deployment success
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${BARK_DEPLOY_NOTIFY_KEY:-}" ]; then
            echo "BARK_DEPLOY_NOTIFY_KEY is not configured; skip deployment notification."
            exit 0
          fi

          notify_url="$(python - <<'PY'
          import os
          from urllib.parse import quote, urlencode

          key = os.environ["BARK_DEPLOY_NOTIFY_KEY"].strip().strip("/")
          title = os.environ["DEPLOY_NOTIFY_TITLE"]
          content = f"版本{os.environ['GITHUB_SHA'][:7]}部署成功"
          query = urlencode(
              {
                  "groupName": "部署通知",
                  "icon": "https://images-sw.tos-cn-shanghai.volces.com/1772521265881.png",
              }
          )
          print(f"https://api.day.app/{key}/{quote(title, safe='')}/{quote(content, safe='')}?{query}")
          PY
          )"
          curl -fsS "$notify_url" >/dev/null
