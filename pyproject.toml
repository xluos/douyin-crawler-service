[project]
name = "douyin-crawler-service"
version = "0.1.0"
description = "HTTP service wrapper for DouYin_Spider public crawling jobs"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "loguru>=0.7.2",
    "playwright>=1.45.0",
    "protobuf3-to-dict>=0.1.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyexecjs>=1.5.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
douyin-crawler-service = "douyin_crawler_service.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
